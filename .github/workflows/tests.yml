name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
          extensions: mbstring, bcmath, pdo_sqlite, pdo_mysql

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare SQLite environment
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p database
          touch database/database.sqlite
          php -r "
            \$env = file_get_contents('.env');
            \$env = preg_replace('/^DB_CONNECTION=.*/m', 'DB_CONNECTION=sqlite', \$env);
            \$env = preg_replace('/^DB_DATABASE=.*/m', 'DB_DATABASE=database/database.sqlite', \$env);
            file_put_contents('.env', \$env);
          "
          php artisan migrate --force

      - name: Install NPM dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Canonical frontend check
        run: npm run check

      - name: TypeScript and Vitest
        run: |
          npm run types:check
          npm run test:unit

      - name: Pint, PHPStan and Pest
        run: |
          vendor/bin/pint --test
          vendor/bin/phpstan analyse --memory-limit=1G
          php artisan test

      - name: Composer audit
        run: composer audit

      - name: npm audit (production)
        run: npm audit --omit=dev

      - name: Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npx playwright test

      - name: Browser BL-P8-02a isolated tests
        run: npx playwright test -c playwright.blp802a.config.ts

      - name: Browser BL-P8-02b isolated tests
        run: npx playwright test -c playwright.blp802b.config.ts

      - name: Browser BL-P8-02c isolated tests
        run: npx playwright test -c playwright.blp802c.config.ts

      - name: Browser BL-P8-02d isolated tests
        run: npx playwright test -c playwright.blp802d.config.ts

      - name: Browser BL-P8-02e isolated tests
        run: npx playwright test -c playwright.blp802e.config.ts

      - name: Browser BL-P9-01a isolated tests
        run: npx playwright test -c playwright.blp901a.config.ts

      - name: Browser BL-P9-01b isolated tests
        run: npx playwright test -c playwright.blp901b.config.ts

      - name: Browser BL-P9-01c isolated tests
        run: npx playwright test -c playwright.blp901c.config.ts

      - name: Browser BL-P9-02a isolated tests
        run: npx playwright test -c playwright.blp902a.config.ts

      - name: Browser PO-AUTH-SPECIAL-APPROVE-1 isolated tests
        run: npx playwright test -c playwright.po-auth-special-approve.config.ts

      - name: Browser PO-NOT002-ADMIN-1 isolated tests
        run: npx playwright test -c playwright.po-not002-admin.config.ts

      - name: Browser PO-USER-ADMIN-1 isolated tests
        run: npx playwright test -c playwright.po-user-admin-1.config.ts

      - name: Browser DSP-DCP-001 isolated tests
        run: npx playwright test -c playwright.dspdcp001.config.ts

      - name: Browser DF-3.2b isolated tests
        run: npx playwright test -c playwright.df32b.config.ts

      - name: Browser DF-3.3-fs isolated tests
        run: npx playwright test -c playwright.df33fs.config.ts

      - name: Browser DF-3.3a2α isolated tests
        run: npx playwright test -c playwright.df33a2a.config.ts

      - name: Browser DF-3.3a2β isolated tests
        run: npx playwright test -c playwright.df33a2b.config.ts

      - name: Browser DF-3.3b isolated tests
        run: npx playwright test -c playwright.df33b.config.ts

      - name: Browser ADV-001b isolated tests
        run: npx playwright test -c playwright.adv001b.config.ts

      - name: Browser ADV-001c3a isolated tests
        run: npx playwright test -c playwright.adv001c3a.config.ts

      - name: Browser ADV-001c3b1 isolated tests
        run: npx playwright test -c playwright.adv001c3b1.config.ts

      - name: Browser ADV-001c3b2 isolated tests
        run: npx playwright test -c playwright.adv001c3b2.config.ts

      - name: Browser ADV-001c3c isolated tests
        run: npx playwright test -c playwright.adv001c3c.config.ts

      - name: Browser ADV-001c4b isolated tests
        run: npx playwright test -c playwright.adv001c4b.config.ts

      - name: Browser wizard inventory collapse isolated tests
        run: npx playwright test -c playwright.wizard-inventory-collapse.config.ts

      - name: Browser DF-3-REST-B isolated tests
        run: npx playwright test -c playwright.df3restb.config.ts

      - name: Browser DF-3-REST-C isolated tests
        run: npx playwright test -c playwright.df3restc.config.ts

      - name: Browser DF-3-RULE-C isolated tests
        run: npx playwright test -c playwright.df3rulec.config.ts

      - name: Browser BL-P2-01a isolated tests
        run: npx playwright test -c playwright.blp201a.config.ts

      - name: Browser BL-P2-02a isolated tests
        run: npx playwright test -c playwright.blp202a.config.ts

      - name: Browser BL-P2-02c isolated tests
        run: npx playwright test -c playwright.blp202c.config.ts

      - name: Browser BL-P4-01a isolated tests
        run: npx playwright test -c playwright.blp401a.config.ts

      - name: Browser BL-P4-01b isolated tests
        run: npx playwright test -c playwright.blp401b.config.ts

      - name: Browser BL-P4-01c isolated tests
        run: npx playwright test -c playwright.blp401c.config.ts
      - name: Browser BL-P4-02b isolated tests
        run: npx playwright test -c playwright.blp402b.config.ts

      - name: Browser BL-P4-02c isolated tests
        run: npx playwright test -c playwright.blp402c.config.ts

      - name: Browser BL-P4-02d isolated tests
        run: npx playwright test -c playwright.blp402d.config.ts

      - name: Browser BL-P4-02e isolated tests
        run: npx playwright test -c playwright.blp402e.config.ts

      - name: Browser BL-P4-03g isolated tests
        run: npx playwright test -c playwright.blp403g.config.ts

      - name: Browser BL-P4-03h isolated tests
        run: npx playwright test -c playwright.blp403h.config.ts

      - name: Browser BL-P4-03i isolated tests
        run: npx playwright test -c playwright.blp403i.config.ts

      - name: Browser BL-P4-03j isolated tests
        run: npx playwright test -c playwright.blp403j.config.ts

      - name: Browser BL-P4-03k isolated tests
        run: npx playwright test -c playwright.blp403k.config.ts

      - name: Browser BL-P5-01a isolated tests
        run: npx playwright test -c playwright.blp501a.config.ts

      - name: Browser PO-ALLONGE-1 isolated tests
        run: npx playwright test -c playwright.po-allonge-1.config.ts --retries=0

      - name: Upload PO-ALLONGE-1 failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: po-allonge-1-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/po-allonge-1/
          retention-days: 7
          if-no-files-found: ignore

      - name: Browser PO-SPOT-SURCHARGE-1 isolated tests
        run: npx playwright test -c playwright.po-spot-surcharge-1.config.ts --retries=0

      - name: Upload PO-SPOT-SURCHARGE-1 failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: po-spot-surcharge-1-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/po-spot-surcharge-1/
          retention-days: 7
          if-no-files-found: ignore

      - name: Browser PO-SPOT-SINGLE-1 isolated tests
        run: npx playwright test -c playwright.po-spot-single-1.config.ts --retries=0

      - name: Upload PO-SPOT-SINGLE-1 failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: po-spot-single-1-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/po-spot-single-1/
          retention-days: 7
          if-no-files-found: ignore

      - name: Browser PO-SWF-PROMO-1 isolated tests
        run: npx playwright test -c playwright.po-swf-promo-1.config.ts --retries=0

      - name: Upload PO-SWF-PROMO-1 failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: po-swf-promo-1-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/po-swf-promo-1/
          retention-days: 7
          if-no-files-found: ignore

      - name: Browser BL-P5-02a isolated tests
        run: npx playwright test -c playwright.blp502a.config.ts

      - name: Browser BL-P2-03a isolated tests
        run: npx playwright test -c playwright.blp203a.config.ts

      - name: Browser CRM Wizard Picker isolated tests
        run: npx playwright test -c playwright.crm-wizard-picker.config.ts

      - name: Browser Calc Dispo Isolation Banner isolated tests
        run: npx playwright test -c playwright.calc-dispo-isolation-banner.config.ts

      - name: Browser CRM Masterdata Search isolated tests
        run: npx playwright test -c playwright.crm-masterdata-search.config.ts

  e2e-spt008:
    name: e2e-spt008
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
          extensions: mbstring, bcmath, pdo_sqlite

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare SQLite environment
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p database
          touch database/database.sqlite
          php -r "
            \$env = file_get_contents('.env');
            \$env = preg_replace('/^DB_CONNECTION=.*/m', 'DB_CONNECTION=sqlite', \$env);
            \$env = preg_replace('/^DB_DATABASE=.*/m', 'DB_DATABASE=database/database.sqlite', \$env);
            file_put_contents('.env', \$env);
          "

      - name: Install NPM dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Browser SPT-008 isolated tests
        run: npm run test:e2e:spt008

      - name: SPT-008 case logs on failure
        if: failure()
        run: |
          shopt -s nullglob
          for log in storage/logs/spt008-*.log; do
            echo "======== ${log} ========"
            tail -n 200 "${log}" || true
          done

  mysql:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: dispo_test
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
          extensions: mbstring, bcmath, pdo_mysql

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Migrate and test on MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: dispo_test
          DB_USERNAME: root
          DB_PASSWORD: ""
          QUEUE_CONNECTION: database
          CACHE_STORE: database
          SESSION_DRIVER: database
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
          vendor/bin/pest --configuration=phpunit.mysql.xml
